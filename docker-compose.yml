services:
  app:  
    container_name: url-shortener-app
    build:
      context: .
      dockerfile: ./docker/Dockerfile

    volumes:
      - .:/app

    ports:
      - "9000:9000"

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    
    env_file:
      - .env
    networks:
      - url_shortener

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  nginx:
    image: nginx:alpine
    container_name: nginx-url-shortener
    ports:
      - "8085:80"
    volumes:
      - ./docker/nginx/conf.d:/etc/nginx/conf.d
    depends_on:
      - app
    networks:
      - url_shortener

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/ping"]
      interval: 30s
      timeout: 10s
      retries: 3 

  postgres:
    image: postgres:16
    container_name: postgres-url-shortener
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - url_shortener
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -p 5432 -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 30s
      timeout: 10s
      retries: 3 

  redis:
    image: redis:alpine
    container_name: redis-url-shortener
    ports:
      - "6385:6379"
    volumes:
      - redis_data:/data
    networks:
      - url_shortener
    # command: redis-server --requirepass ${REDIS_PASSWORD}
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]

networks:
  url_shortener:
    driver: bridge

volumes:
  postgres_data:
  redis_data:

  