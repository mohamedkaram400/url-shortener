# Define upstream Go app (talks to container "app" on port 6000)
upstream url-shortener {
    server app:6000;
}

# Define rate limit zone
limit_req_zone $binary_remote_addr zone=goapp:10m rate=2r/s;

server {
    listen 80 default_server;
    server_name url-shortener.test;

    access_log /var/log/nginx/go.access.log;
    error_log /var/log/nginx/go.error.log;

    # Reverse proxy all requests to Go app
    location / {
        proxy_pass http://url-shortener;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Apply rate limiter
        limit_req zone=goapp burst=5 nodelay;
        limit_req_status 429;
    }

    # Optional: serve static assets directly from Nginx if you want
    location /static/ {
        alias /app/static/;
        expires 30d;
        access_log off;
    }
}

